# Production Nginx Configuration for Outpost Games - Combined Container
# For use with Dockerfile.combined (single container deployment)
# Fly.io / Railway / Single Container Platforms
#
# Features:
# - Security headers (XSS, CSRF, frame protection)
# - Gzip compression (6 level)
# - Static asset caching (1 year for immutable assets)
# - API proxy to localhost:3001 (same container)
# - HTTP/2 optimization

server {
    listen 80;
    server_name outpostgamesrgv.com www.outpostgamesrgv.com;
    root /usr/share/nginx/html;
    index index.html;

    # Nginx's default (1M) is smaller than Multer's 15MB product-image upload
    # limit in api/server.js, so uploads over ~1MB were rejected here before
    # ever reaching the Node API.
    client_max_body_size 20M;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # HTTP/2 optimization
    http2_push_preload on;

    # Connection optimization
    keepalive_timeout 65;
    keepalive_requests 100;

    # Enhanced Gzip compression
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/rss+xml
        application/atom+xml
        application/x-web-app-manifest+json
        application/manifest+json
        image/svg+xml
        font/woff
        font/woff2;

    # Disable gzip for small files
    gzip_disable "msie6";

    # Enable ETags
    etag on;

    # API proxy - 127.0.0.1:3001 (same container, explicit IPv4)
    location /api {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Connection pooling
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
        
        # Timeouts
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        
        # Disable caching for API (including Cloudflare)
        add_header Cache-Control "no-cache, no-store, must-revalidate, private, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header CDN-Cache-Control "no-cache" always;
        add_header Cloudflare-CDN-Cache-Control "no-cache" always;
        expires -1;
    }

    # Versioned assets - aggressive caching
    location ~* \.(js|css)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        
        # Precompressed static assets
        gzip_static on;
    }

    # Images - long cache with revalidation
    location ~* \.(png|jpg|jpeg|gif|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, stale-while-revalidate=86400";
        access_log off;
        
        # Image optimization
        add_header Vary Accept;
    }

    # SVG and icons
    location ~* \.(svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000";
        access_log off;
    }

    # Web fonts
    location ~* \.(woff|woff2|ttf|eot|otf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
        access_log off;
    }

    # Media files
    location ~* \.(mp4|webm|ogg|mp3|wav)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000";
        access_log off;
    }

    # HTML - no cache but allow revalidation (bfcache friendly)
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Service Worker
    location = /service-worker.js {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Manifest and robots
    location ~* \.(json|xml|txt)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # Marketing/poster assets directory (wpn-assets)
    location /wpn-assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000";
        access_log off;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # SPA fallback - catch all
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security: Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Security: Deny access to backup/config files
    location ~ ~$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}
