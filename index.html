<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Critical: Favicon -->
    <link rel="icon" type="image/png" href="/squarespace-app-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <!-- Viewport for responsive design -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- SEO Meta Tags -->
    <meta
      name="description"
      content="The Outpost Games - Your premier TCG shop in Rio Grande City, Texas, carrying Magic: The Gathering, Pokémon, One Piece, Gundam, and Riftbound. Weekly tournaments, events, and a welcoming community."
    />
    <meta
      name="keywords"
      content="Magic the Gathering, MTG, Pokemon, One Piece, Gundam Card Game, Riftbound, Rio Grande City, card games, tournaments, TCG"
    />
    <meta name="author" content="The Outpost Games" />
    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://outpostgamesrgv.com/" />

    <!-- Theme Color for mobile browsers -->
    <meta name="theme-color" content="#0f2436" />

    <!-- Preconnect to external domains for faster resource loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Load Google Fonts asynchronously to avoid blocking render -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400..700&display=swap"
      media="print"
      onload="this.media = 'all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400..700&display=swap"
      />
    </noscript>

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://outpostgamesrgv.com/" />
    <meta property="og:title" content="The Outpost Games — TCG Shop in Rio Grande City, TX" />
    <meta
      property="og:description"
      content="Magic: The Gathering, Pokémon, One Piece, Gundam, and Riftbound in Rio Grande City, Texas."
    />
    <meta property="og:image" content="https://outpostgamesrgv.com/og-image.png" />
    <meta property="og:site_name" content="The Outpost Games" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="The Outpost Games — TCG Shop in Rio Grande City, TX" />
    <meta
      name="twitter:description"
      content="Magic: The Gathering, Pokémon, One Piece, Gundam, and Riftbound in Rio Grande City, Texas."
    />
    <meta name="twitter:image" content="https://outpostgamesrgv.com/og-image.png" />

    <title>The Outpost Games — TCG Shop in Rio Grande City, TX</title>

    <!-- Structured data: site-wide LocalBusiness facts. Static (not per-route
         reactive like the Event JSON-LD on /events) since it never changes and
         benefits from being crawl-visible without any JS execution at all. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "LocalBusiness",
        "name": "The Outpost Games",
        "url": "https://outpostgamesrgv.com/",
        "image": "https://outpostgamesrgv.com/og-image.png",
        "email": "theoutpostgamingrgv@gmail.com",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "605 W. Main Street, Suite 4",
          "addressLocality": "Rio Grande City",
          "addressRegion": "TX",
          "postalCode": "78582",
          "addressCountry": "US"
        },
        "openingHoursSpecification": [
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": ["Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"],
            "opens": "17:30",
            "closes": "22:00"
          }
        ],
        "sameAs": [
          "https://linktr.ee/TheOutpostGamesRGC",
          "https://www.instagram.com/theoutpostgames_rgc",
          "https://www.facebook.com/Theoutpostgames/",
          "https://discord.gg/PW3YkMtFmz"
        ]
      }
    </script>

    <!-- Inline critical CSS for instant render. Keep this minimal: it's
         unlayered, so anything here outranks every Tailwind layer (a reset of
         border-width here once silently erased every border on the site). -->
    <style>
      body {
        margin: 0;
        background: #0f2436;
      }
      #app {
        min-height: 100vh;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <!-- Module script - non-blocking by default -->
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
