version: '3.8'

services:
  # Redis - Lightweight data store
  redis:
    image: redis:7-alpine
    container_name: outpost-redis
    command: redis-server --maxmemory 64mb --maxmemory-policy allkeys-lru --save 60 1
    # Port mapping removed - Redis is only accessed internally by the API
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # API Backend
  api:
    build:
      context: ../api
      dockerfile: Dockerfile
    container_name: outpost-api
    # Docker Compose's own file-based env mechanisms (`env_file:`, and its
    # automatic top-level .env loading) both re-interpolate ${...} patterns
    # *within* the values they read — which silently corrupts anything
    # containing a literal `$`, like a bcrypt hash in ADMIN_USERS (confirmed
    # live: it got truncated to "$$2b$$10"). Bind-mounting the real .env file
    # and letting server.js's own dotenv call read it directly sidesteps
    # Compose's env handling entirely, so `$` in secrets survives correctly.
    # server.js resolves it at path.resolve(__dirname, '..', '.env'), which
    # with this image's WORKDIR (/app/api) is /app/.env.
    volumes:
      - ../.env:/app/.env:ro
      # Marketing posters, read directly off disk by api/marketingPosters.js —
      # this container's WORKDIR/repo-root layout differs from the combined
      # production image, so the default path resolution doesn't apply here.
      - ../public/wpn-assets/posters:/wpn-assets/posters:ro
    # dotenv never overrides an already-set process.env value, so these still
    # win over whatever the mounted .env says — deliberately forcing this
    # container to always use the local containerized Redis, never whatever
    # REDIS_URL happens to be in .env (e.g. a real Upstash URL).
    environment:
      - PORT=3001
      - REDIS_URL=redis://redis:6379
      - NODE_ENV=production
      - MARKETING_POSTERS_DIR=/wpn-assets/posters
    ports:
      - "3001:3001"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3

  # Frontend — uses Dockerfile.dev (excludes WPN assets from image, mounts them instead)
  web:
    build:
      context: ..
      dockerfile: Dockerfile.dev
    container_name: outpost-web
    environment:
      - VITE_API_URL=/api
    ports:
      - "80:80"
    volumes:
      # Mount WPN assets directly from host — keeps ~1GB out of the image
      - ../public/wpn-assets:/usr/share/nginx/html/wpn-assets:ro
    depends_on:
      - api
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 3s
      retries: 3

volumes:
  redis-data:
    driver: local
