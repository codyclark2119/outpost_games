version: '3.8'

services:
  # Redis - Lightweight data store
  redis:
    image: redis:7-alpine
    container_name: outpost-redis
    command: redis-server --maxmemory 64mb --maxmemory-policy allkeys-lru --save 60 1
    # Port mapping removed - Redis is only accessed internally by the API
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # API Backend
  api:
    build:
      context: ../api
      dockerfile: Dockerfile
    container_name: outpost-api
    environment:
      - PORT=3001
      - REDIS_URL=redis://redis:6379
      - NODE_ENV=production
    ports:
      - "3001:3001"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3

  # Frontend
  web:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: outpost-web
    environment:
      - VITE_API_URL=/api
    ports:
      - "80:80"
    depends_on:
      - api
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 3s
      retries: 3

volumes:
  redis-data:
    driver: local
