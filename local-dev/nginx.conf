# Nginx Configuration for Outpost Games
# ✅ PRODUCTION: outpostgamesrgv.com
# 
# This config serves the Vue.js frontend and proxies API requests
# Used in: Combined Dockerfile (Dockerfile.combined)
# Domain: outpostgamesrgv.com (via Cloudflare CDN)

server {
    listen 80;
    http2 on;
    server_name outpostgamesrgv.com www.outpostgamesrgv.com;
    root /usr/share/nginx/html;
    index index.html;

    # Enhanced Gzip compression for better performance
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/rss+xml
        application/atom+xml
        application/x-web-app-manifest+json
        application/manifest+json
        image/svg+xml
        font/woff
        font/woff2;

    # Enable ETags for better caching validation
    etag on;

    # API proxy
    location /api {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Disable caching for API responses
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires -1;
    }

    # JavaScript and CSS with versioned filenames (hash-based) - aggressive caching
    location ~* \.(js|css)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Images - long cache with revalidation
    location ~* \.(png|jpg|jpeg|gif|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, stale-while-revalidate=86400";
        access_log off;
    }

    # SVG and icons
    location ~* \.(svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000";
        access_log off;
    }

    # Web fonts - aggressive caching
    location ~* \.(woff|woff2|ttf|eot|otf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
        access_log off;
    }

    # Media files
    location ~* \.(mp4|webm|ogg|mp3|wav)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000";
        access_log off;
    }

    # HTML files - no cache but allow revalidation
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
        # bfcache friendly - don't use no-store
    }

    # Service Worker - never cache
    location = /service-worker.js {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Manifest and other config files
    location ~* \.(json|xml)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # robots.txt
    location = /robots.txt {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        log_not_found off;
    }

    # sitemap.xml
    location = /sitemap.xml {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        log_not_found off;
    }

    # Vue Router support - serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
        
        # Cache HTML with short TTL and revalidation
        add_header Cache-Control "no-cache, must-revalidate";
        expires -1;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    
    # Performance hint for preload/prefetch support
    add_header Accept-CH "DPR, Viewport-Width, Width" always;
}
