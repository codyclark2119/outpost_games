# TLS terminates at the trusted edge; HSTS applies only to the store's hosts.
map $host $outpost_hsts {
    default "";
    outpostgamesrgv.com "max-age=31536000";
    www.outpostgamesrgv.com "max-age=31536000";
}

# Production Nginx Configuration for Outpost Games - Docker Compose
# For use with docker-compose.prod.yml (multi-container deployment)
# VPS / AWS Lightsail / Multi-container Platforms
#
# Features:
# - Security headers (XSS, CSRF, frame protection)
# - Gzip compression (6 level)
# - Static asset caching (1 year for immutable assets)
# - API proxy to api:3001 (separate container via Docker network)

server {
    include /etc/nginx/security-headers.conf;
    listen 80;
    server_name outpostgamesrgv.com www.outpostgamesrgv.com;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 20M;

    # Shared security headers and CSP rationale: nginx.security-headers.conf.

    # Connection optimization
    keepalive_timeout 65;
    keepalive_requests 100;

    # Enhanced Gzip compression
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/rss+xml
        application/atom+xml
        application/x-web-app-manifest+json
        application/manifest+json
        image/svg+xml
        font/woff
        font/woff2;

    # Disable gzip for small files

    # Enable ETags
    etag on;

    # API proxy - api:3001 (separate container via Docker network)
    #
    # ^~ (not a plain prefix match): nginx evaluates the regex locations
    # below even after a plain prefix match wins, and a regex match then
    # takes precedence — so /api/<anything>.json|.txt|.xml|.js was being
    # served as a static file (404) rather than proxied. ^~ stops that
    # regex pass, keeping every /api/* request on the Node API.
    location ^~ /api {
        include /etc/nginx/security-headers.conf;
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Connection pooling
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
        
        # Timeouts
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        
        # Disable caching for API (including Cloudflare)
        add_header Cache-Control "no-cache, no-store, must-revalidate, private, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header CDN-Cache-Control "no-cache" always;
        add_header Cloudflare-CDN-Cache-Control "no-cache" always;
        expires -1;
    }

    # Versioned assets - aggressive caching
    location ~* \.(js|css)$ {
        include /etc/nginx/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        
        # Precompressed static assets
        gzip_static on;
    }

    # Images - long cache with revalidation
    location ~* \.(png|jpg|jpeg|gif|webp|avif)$ {
        include /etc/nginx/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, stale-while-revalidate=86400";
        access_log off;
        
        # Image optimization
        add_header Vary Accept;
    }

    # SVG and icons
    location ~* \.(svg|ico)$ {
        include /etc/nginx/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000";
        access_log off;
    }

    # Web fonts
    location ~* \.(woff|woff2|ttf|eot|otf)$ {
        include /etc/nginx/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
        access_log off;
    }

    # Media files
    location ~* \.(mp4|webm|ogg|mp3|wav)$ {
        include /etc/nginx/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000";
        access_log off;
    }

    # HTML - no cache but allow revalidation (bfcache friendly)
    location ~* \.html$ {
        include /etc/nginx/security-headers.conf;
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header CDN-Cache-Control "no-cache" always;
        add_header Cloudflare-CDN-Cache-Control "no-cache" always;

    }

    # Service Worker
    location = /service-worker.js {
        include /etc/nginx/security-headers.conf;
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Manifest and robots
    location ~* \.(json|xml|txt)$ {
        include /etc/nginx/security-headers.conf;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # Marketing/poster assets directory (wpn-assets)
    location /wpn-assets/ {
        include /etc/nginx/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000";
        access_log off;
    }

    # Health check endpoint
    location /health {
        include /etc/nginx/security-headers.conf;
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # SPA fallback - catch all
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security: Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Security: Deny access to backup/config files
    location ~ ~$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}
